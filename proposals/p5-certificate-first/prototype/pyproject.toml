[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-tactic-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "sympy>=1.13"]
description = "Executable research prototypes, not a Lean tactic implementation"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
