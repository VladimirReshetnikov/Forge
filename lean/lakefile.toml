name = "forge-replay"
version = "0.1.0"
defaultTargets = ["ForgeCore", "Forge"]

# ---------------------------------------------------------------------------
# Mathlib revision. Three of the nine proposals shipped a build manifest and all
# three pinned this same revision, whose lean-toolchain specifies
# leanprover/lean4:v4.34.0 -- the version in lean-toolchain here.
#
# No proposal ever built this. `ForgeCore` has been elaborated against
# Lean v4.34.0 (results/lean-core-elaboration.json); `Forge` has not, because it
# needs Mathlib.
# ---------------------------------------------------------------------------
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "1cf325a0cf67aca2b04d76b5380ff6a9e410aefa"

# Core Lean only: the two design contracts and the Mathlib-free structural
# proofs. Builds without Mathlib, and is the only part of this project with
# recorded compilation evidence.
[[lean_lib]]
name = "ForgeCore"

# Everything else. Requires a built Mathlib.
[[lean_lib]]
name = "Forge"
