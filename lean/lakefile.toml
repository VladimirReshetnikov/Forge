name = "forge-replay"
version = "0.1.0"
defaultTargets = ["ForgeCore", "Forge"]

# ---------------------------------------------------------------------------
# Mathlib revision. Three of the nine proposals shipped a build manifest and all
# three pinned this same revision, whose lean-toolchain specifies
# leanprover/lean4:v4.34.0 -- the version in lean-toolchain here.
#
# No proposal ever built this. Every file in `ForgeCore` has been elaborated
# against Lean v4.34.0 (results/lean-core-elaboration.json and
# results/lean-closure-elaboration.json). `lake build` has since fetched this
# revision with its prebuilt cache, and every Mathlib-dependent file in `Forge`
# compiles against it (tools/build_mathlib_forge.py,
# results/lean-mathlib-forge.json). lake-manifest.json records the resolved
# dependency revisions from that fetch.
# ---------------------------------------------------------------------------
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "1cf325a0cf67aca2b04d76b5380ff6a9e410aefa"

# Core Lean only: the two design contracts, the Mathlib-free structural proofs,
# and the three closure-principle files. Builds without Mathlib, and is the part
# of this project with recorded compilation evidence.
[[lean_lib]]
name = "ForgeCore"

# Everything else. Requires a built Mathlib (see tools/build_mathlib_forge.py).
[[lean_lib]]
name = "Forge"
